name: Update PL Data

on:
  schedule:
    # 每 3 小时跑一次（UTC 0/3/6/9/12/15/18/21）
    # 对应马来西亚时间：8/11/14/17/20/23/2/5 点
    - cron: '0 */3 * * *'
  workflow_dispatch:
  # 支持手动触发（Actions 页面点 Run workflow）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update.js
        run: node update.js
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
          BZZOIRO_KEY: ${{ secrets.BZZOIRO_KEY }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi