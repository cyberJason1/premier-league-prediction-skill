    function importHistory(){
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = '.json';
        inp.onchange = e => {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = () => {
                try { const arr = JSON.parse(r.result); if(!Array.isArray(arr)) throw 0; setHistory(arr); renderHistory(); refreshDashboard(); toast('导入成功'); }
                catch { toast('导入失败：文件格式错误','err'); }
            };
            r.readAsText(f);
        };
        inp.click();
    }

    /* 模态框 */
    let _focusBefore = null;
    function openModal(id){
        _focusBefore = document.activeElement;
        const mask = document.getElementById(id);
        mask.classList.add('show');
        document.body.classList.add('no-scroll');
        setTimeout(() => mask.querySelector('.modal')?.focus(), 50);
    }
    function closeModal(id){
        const mask = document.getElementById(id);
        mask.classList.remove('show');
        document.body.classList.remove('no-scroll');
        _focusBefore?.focus();
    }
    function openHistory(){ openModal('histMask'); renderHistory(); }
    function closeHistory(){ closeModal('histMask'); }
    function openBatch(){ openModal('batchMask'); updateQuota(); }
    function closeBatch(){ closeModal('batchMask'); }
    document.querySelectorAll('.mask').forEach(m => {
        m.addEventListener('click', e => { if (e.target === m) closeModal(m.id); });
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'Tab') {
            const activeMask = document.querySelector('.mask.show');
            if (!activeMask) return;
            const focusable = activeMask.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
            if (!focusable.length) return;
            const first = focusable[0], last = focusable[focusable.length-1];
            if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
    });

    /* 批量 */
    let batchN = 1;
    function updateQuota(){
        const calls = 10 * batchN;
        const el = document.getElementById('batchQuota');
        el.className = 'quota ' + (calls <= 20 ? 'ok' : calls <= 50 ? 'warn' : 'bad');
        el.textContent = `预计消耗 ${calls} 次调用（Groq 每天 1000 次）`;
    }
    document.getElementById('batchOpts').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        batchN = +b.dataset.n;
        document.querySelectorAll('#batchOpts button').forEach(x => x.classList.toggle('on', x === b));
        updateQuota();
    });
    function mode(arr){
        const m = new Map();
        arr.forEach(x => m.set(x, (m.get(x)||0)+1));
        let best = null, bestN = 0;
        for (const [k,v] of m) if (v > bestN) { best = k; bestN = v; }
        return best;
    }
    async function predictOne(skill, r, home, away, intel){
        const runs = [];
        for (let k = 0; k < batchN; k++) {
            try {
                const userPrompt = (intel ? `【今日情报】\n${intel}\n\n` : '') +
                    `【预测指令】\n请预测：第 ${r+1} 轮  ${home} vs ${away}\n严格按 skill.md 输出契约返回 JSON。`;
                const raw = await callGroq(skill, userPrompt);
                const p = JSON.parse(raw);
                const v = validateAndNormalizePrediction(p);
                if (v.ok) runs.push(v.data);
            } catch(e){}
        }
        if (!runs.length) return null;
        return {
            homeWin: Math.round(runs.reduce((s,x)=>s+x.homeWin,0)/runs.length*100)/100,
            draw: Math.round(runs.reduce((s,x)=>s+x.draw,0)/runs.length*100)/100,
            awayWin: Math.round(runs.reduce((s,x)=>s+x.awayWin,0)/runs.length*100)/100,
            score: mode(runs.map(x=>x.score)),
            confidence: mode(runs.map(x=>x.confidence)),
            keyFactors: runs[0].keyFactors,
            analysis: runs[0].analysis,
            headToHead: runs[0].headToHead,
            _multi: batchN
        };
    }
    async function runBatch(){
        const btn = document.getElementById('batchBtn');
        if (!getKey()) return toast('请先填 Groq API Key','warn');
        const r = +document.getElementById('roundSel').value || 0;
        const round = FIXTURES[r] || [];
        if (!round.length) return toast('本轮无赛程','warn');
        const calls = round.length * batchN;
        if (calls > 30 && !confirm(`将消耗约 ${calls} 次 API 调用，确认？`)) return;

        btn.disabled = true;
        btn.classList.add('loading');
        btn.textContent = '批量运行中…';
        const intel = document.getElementById('intel').value.trim();
        const progressEl = document.getElementById('batchProgress');
        const barEl = document.getElementById('batchProgressBar');
        progressEl.classList.add('show');
        barEl.style.width = '0%';
        let ok = 0, fail = 0, done = 0;

        try {
            const skill = await loadSkill();
            const CONCURRENCY = 3;
            let cursor = 0;
            async function worker(){
                while (cursor < round.length) {
                    const i = cursor++;
                    const { home, away } = round[i];
                    const res = await predictOne(skill, r, home, away, intel);
                    if (res) { addHistory({ round:r, home, away, ...res, ts:Date.now() }); ok++; }
                    else fail++;
                    done++;
                    barEl.style.width = (done/round.length*100) + '%';
                    document.getElementById('batchQuota').textContent =
                        `进度 ${done}/${round.length} · 成功 ${ok} · 失败 ${fail}`;
                }
            }
            await Promise.all(Array.from({length: Math.min(CONCURRENCY, round.length)}, worker));
            toast(`批量完成：成功 ${ok} 场${fail?`，失败 ${fail} 场`:''}`, fail?'warn':'ok');
            closeBatch();
            refreshDashboard();
        } catch(err){
            toast(err.message.slice(0,80),'err');
        } finally {
            btn.disabled = false;
            btn.classList.remove('loading');
            btn.textContent = '开始批量预测';
            setTimeout(() => { progressEl.classList.remove('show'); barEl.style.width = '0%'; }, 1500);
        }
    }

    /* 快捷键 */
    window.addEventListener('keydown', e => {
        const ctrl = e.ctrlKey || e.metaKey;
        if (ctrl && e.key === 'Enter') { e.preventDefault(); if (!document.getElementById('predictBtn').disabled) startPredict(); }
        if (ctrl && e.key.toLowerCase() === 'h') { e.preventDefault(); openHistory(); }
        if (ctrl && e.key.toLowerCase() === 'b') { e.preventDefault(); openBatch(); }
        if (e.key === 'Escape') { closeHistory(); closeBatch(); }
    });
    window.addEventListener('scroll', () => {
        document.getElementById('topBtn').classList.toggle('show', window.scrollY > 400);
    });

    /* 加载 data.json */
    async function loadExternalData(){
        try {
            const res = await fetch(`data.json?v=${Date.now()}`, { cache: 'no-store' });
            if (!res.ok) {
                toast('data.json 加载失败，请跑一次 update.bat', 'warn', 5000);
                console.warn('⚠️ data.json 未找到');
                return;
            }
            const data = await res.json();
            if (Array.isArray(data.fixtures) && data.fixtures.length) {
                FIXTURES.length = 0;
                FIXTURES.push(...data.fixtures);
            }
            if (data.results && typeof data.results === 'object') {
                Object.keys(RESULTS).forEach(k => delete RESULTS[k]);
                Object.assign(RESULTS, data.results);
                _last5Cache = null;
            }
            if (Array.isArray(data.standings) && data.standings.length) {
                STATIC_STANDINGS = data.standings;
            }
            initSelectors();
            renderStandings(STATIC_STANDINGS);
            refreshDashboard();
            if (data.updatedAt && data.updatedAt !== '1970-01-01T00:00:00Z') {
                console.log(`✅ data.json 已加载（${new Date(data.updatedAt).toLocaleString('zh-CN')}）`);
            } else {
                toast('data.json 是空壳，请跑一次 update.bat', 'warn', 5000);
            }
        } catch(e){
            toast('data.json 加载失败', 'warn');
            console.warn('⚠️ data.json 加载失败', e);
        }
    }

    /* 启动 */
    (async function boot(){
        // 启动氛围引擎
        Ambient.init();
        LoadingBar.start();

        // Hero 标题逐字入场
        splitHeroTitle();

        // 恢复 API Key
        const saved = localStorage.getItem('groq_key');
        if (saved) document.getElementById('apiKey').value = saved;

        const rs = document.getElementById('roundSel');
        rs.addEventListener('change', () => { localStorage.setItem('last_round', rs.value); fillMatches(); refreshDashboard(); });
        document.getElementById('matchSel').addEventListener('change', () => {
            const r = +rs.value || 0;
            localStorage.setItem('last_match_'+r, document.getElementById('matchSel').value);
            refreshDashboard();
        });
        document.getElementById('histFilters').addEventListener('click', e => {
            const b = e.target.closest('button'); if (!b) return;
            histFilter = b.dataset.f;
            document.querySelectorAll('#histFilters button').forEach(x => x.classList.toggle('on', x === b));
            renderHistory();
        });

        initSelectors();
        renderStandings(STATIC_STANDINGS);
        refreshDashboard();
        updateMatchdayLine();

        await loadExternalData();

        // 加载完成
        LoadingBar.done();

        // 队徽预加载
        const preload = () => {
            Object.values(ESPN_IDS).forEach(id => {
                const img = new Image();
                img.referrerPolicy = 'no-referrer';
                img.src = `https://a.espncdn.com/i/teamlogos/soccer/500/${id}.png`;
            });
            console.log('✅ 已预加载 20 队队徽');
        };
        if ('requestIdleCallback' in window) requestIdleCallback(preload, { timeout: 2000 });
        else setTimeout(preload, 1200);
    })();

    /* Service Worker */
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    const newSW = reg.installing;
                    if (!newSW) return;
                    newSW.addEventListener('statechange', () => {
                        if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                            showUpdateToast(reg);
                        }
                    });
                });
            }).catch(err => console.warn('SW 注册失败：', err));
        });
    }
    function showUpdateToast(reg){
        const el = document.createElement('div');
        el.className = 'toast ok';
        el.style.cursor = 'pointer';
        el.innerHTML = '🎉 新版本已就绪 · <b>点击刷新</b>';
        el.onclick = () => {
            if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            setTimeout(() => location.reload(), 200);
        };
        document.getElementById('toastWrap').appendChild(el);
        setTimeout(() => el.remove(), 8000);
    }
</script>
</body>
