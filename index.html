<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>英超预测引擎 v3.2</title>
    <style>
        :root{
            --bg:#050810; --bg2:#0a1220; --panel:rgba(16,22,36,.72);
            --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
            --orange:#ff6b35; --blue:#00d4ff; --green:#00ff88;
            --gold:#ffb648; --red:#f43f5e; --purple:#8b5cf6;
            --txt:#e8eef7; --txt2:#8b98ab; --txt3:#5a6779;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
        body::before{
            content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
            background:
                    radial-gradient(1200px 600px at 50% -10%,rgba(255,107,53,.18),transparent 60%),
                    radial-gradient(1000px 500px at 50% 110%,rgba(0,212,255,.12),transparent 60%),
                    repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 60px),
                    repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 60px);
        }
        .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:32px 22px 120px}
        .hero{padding:28px 8px 22px;border-bottom:1px solid var(--line)}
        .hero .kick{font-size:12px;letter-spacing:.28em;color:var(--orange);text-transform:uppercase;font-weight:700}
        .hero h1{font-family:Georgia,"Times New Roman",serif;font-size:52px;line-height:1.05;font-weight:400;margin:10px 0 6px;letter-spacing:-.02em}
        .hero h1 em{font-style:italic;color:var(--orange)}
        .hero p{color:var(--txt2);font-size:14px;margin-top:6px}
        .dash{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 26px}
        .cell{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;backdrop-filter:blur(12px)}
        .cell .lbl{font-size:11px;letter-spacing:.2em;color:var(--txt3);text-transform:uppercase}
        .cell .val{font-family:Georgia,serif;font-size:32px;color:var(--txt);margin-top:6px;line-height:1}
        .cell .val.orange{color:var(--orange)} .cell .val.blue{color:var(--blue)}
        .grid{display:grid;grid-template-columns:400px 1fr;gap:22px}
        @media(max-width:920px){.grid{grid-template-columns:1fr}.hero h1{font-size:38px}.dash{grid-template-columns:repeat(2,1fr)}}
        .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;backdrop-filter:blur(12px)}
        .card h3{font-size:12px;letter-spacing:.22em;color:var(--txt3);text-transform:uppercase;font-weight:700;margin-bottom:14px}
        .field{margin-bottom:14px}
        .field label{display:block;font-size:12px;color:var(--txt2);margin-bottom:6px}
        select,input,textarea{width:100%;background:#0a0f1a;border:1px solid var(--line2);color:var(--txt);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
        select:focus,input:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,53,.18)}
        textarea{resize:vertical;min-height:88px;line-height:1.5}
        .btn{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff6b35,#ff8b5a);color:#1a0f08;font-weight:800;font-size:15px;letter-spacing:.06em;cursor:pointer;transition:transform .15s,filter .15s;position:relative;overflow:hidden}
        .btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
        .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
        .btn.ghost{background:transparent;color:var(--txt2);border:1px solid var(--line2)}
        .empty{color:var(--txt3);text-align:center;padding:60px 10px;font-size:14px}
        .scoreboard{text-align:center;padding:14px 0 20px;border-bottom:1px solid var(--line);margin-bottom:18px}
        .teams{display:flex;align-items:center;justify-content:center;gap:22px}
        .team{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px}
        .badge{width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 6px 20px rgba(0,0,0,.5));transition:transform .25s;position:relative;display:block}
        .badge:hover{transform:scale(1.08)}
        .team .fallback{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#1a2233,#0d1420);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:22px;color:var(--txt2);letter-spacing:.05em}
        .team .nm{font-size:14px;font-weight:600}
        .score{font-family:Georgia,serif;font-size:56px;color:var(--green);text-shadow:0 0 24px rgba(0,255,136,.35);letter-spacing:.02em;white-space:nowrap}
        .score.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
        @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1)}}
        .rings{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
        .ring{background:rgba(10,15,26,.6);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center}
        .ring svg{width:96px;height:96px;transform:rotate(-90deg)}
        .ring circle{fill:none;stroke-width:8;stroke-linecap:round}
        .ring .track{stroke:rgba(255,255,255,.08)}
        .ring .bar{transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)}
        .ring .lbl2{font-size:11px;letter-spacing:.18em;color:var(--txt3);text-transform:uppercase;margin-top:8px}
        .ring .num{font-family:Georgia,serif;font-size:24px;margin-top:2px}
        .ring.h .num{color:var(--orange)} .ring.d .num{color:var(--txt2)} .ring.a .num{color:var(--blue)}
        .sect{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
        .sect .ttl{font-size:11px;letter-spacing:.22em;color:var(--txt3);text-transform:uppercase;font-weight:700;margin-bottom:10px}
        .kv{color:var(--txt);font-size:14px;line-height:1.7}
        .factors{display:flex;flex-wrap:wrap;gap:8px}
        .chip{background:rgba(255,107,53,.12);border:1px solid rgba(255,107,53,.28);color:#ffb59a;font-size:12px;padding:5px 10px;border-radius:999px}
        .conf{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700}
        .conf.高{background:rgba(0,255,136,.14);color:var(--green);border:1px solid rgba(0,255,136,.3)}
        .conf.中高{background:rgba(0,212,255,.14);color:var(--blue);border:1px solid rgba(0,212,255,.3)}
        .conf.中{background:rgba(255,182,72,.14);color:var(--gold);border:1px solid rgba(255,182,72,.3)}
        .conf.低{background:rgba(244,63,94,.14);color:var(--red);border:1px solid rgba(244,63,94,.3)}
        .h2h{border:1px solid rgba(139,92,246,.35);background:rgba(139,92,246,.06);border-radius:12px;padding:14px 16px;position:relative}
        .h2h .tag{position:absolute;top:-9px;right:12px;font-size:10px;padding:3px 8px;border-radius:6px;letter-spacing:.1em;font-weight:700}
        .h2h .tag.估算{background:rgba(255,182,72,.18);color:var(--gold);border:1px solid rgba(255,182,72,.4)}
        .h2h .tag.资料库{background:rgba(0,255,136,.18);color:var(--green);border:1px solid rgba(0,255,136,.4)}
        .h2h .tag.今日情报{background:rgba(0,212,255,.18);color:var(--blue);border:1px solid rgba(0,212,255,.4)}
        .h2h .sum{font-size:14px;margin-bottom:8px}
        .h2h ul{list-style:none;font-size:13px;color:var(--txt2)}
        .h2h li{padding:3px 0}
        .h2h li::before{content:"›";color:var(--purple);margin-right:8px;font-weight:700}
        .players{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
        .pcard{background:linear-gradient(160deg,rgba(255,107,53,.14),rgba(0,212,255,.08));border:1px solid var(--line2);border-radius:12px;padding:12px;transition:transform .2s,box-shadow .2s}
        .pcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.4)}
        .pcard .row{display:flex;justify-content:space-between;align-items:center}
        .pcard .nm{font-size:13px;font-weight:700}
        .pcard .pos{font-size:10px;color:var(--txt3);letter-spacing:.12em;text-transform:uppercase}
        .pcard .rt{margin-top:8px;display:flex;align-items:center;gap:8px}
        .pcard .rating{font-family:Georgia,serif;font-size:22px;color:var(--orange);font-weight:700}
        .pcard .note{font-size:11px;color:var(--txt2);line-height:1.5;margin-top:6px}
        .standings{font-size:13px}
        .standings table{width:100%;border-collapse:collapse}
        .standings th{color:var(--txt3);font-size:10px;letter-spacing:.15em;text-transform:uppercase;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
        .standings td{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.04)}
        .standings td:first-child{font-family:Georgia,serif;color:var(--txt2);width:26px}
        .standings tr.ucl td:first-child{color:var(--green)}
        .standings tr.rel td:first-child{color:var(--red)}
        .loader{display:flex;flex-direction:column;align-items:center;gap:14px;padding:50px 0}
        .ball{width:46px;height:46px;border-radius:50%;background:
                radial-gradient(circle at 35% 30%,#fff 0 12%,transparent 13%),
                conic-gradient(from 0deg,#fff 0 25%,#111 25% 50%,#fff 50% 75%,#111 75% 100%);
            box-shadow:0 10px 24px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.06);
            animation:bounce .7s cubic-bezier(.2,.6,.4,1) infinite alternate,spin 1.4s linear infinite}
        @keyframes bounce{to{transform:translateY(-22px)}}
        @keyframes spin{to{transform:rotate(360deg)}}
        .loader .msg{font-size:13px;color:var(--txt2);letter-spacing:.05em}
        .fab{position:fixed;right:24px;width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.45);transition:transform .2s,filter .2s;z-index:60}
        .fab:hover{transform:translateY(-2px) scale(1.05);filter:brightness(1.1)}
        .fab.hist{bottom:24px;background:linear-gradient(135deg,#ff6b35,#ff8b5a);color:#1a0f08}
        .fab.batch{bottom:88px;background:linear-gradient(135deg,#00d4ff,#5cc8ff);color:#02131c}
        .fab.top{bottom:152px;background:rgba(255,255,255,.12);border:1px solid var(--line2);opacity:0;pointer-events:none;transition:opacity .25s}
        .fab.top.show{opacity:1;pointer-events:auto}
        .fab .badge-n{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:20px;height:20px;border-radius:10px;padding:0 5px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
        .mask{position:fixed;inset:0;background:rgba(3,5,10,.78);backdrop-filter:blur(6px);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto}
        .mask.show{display:flex}
        .modal{background:#0b1220;border:1px solid var(--line2);border-radius:18px;max-width:760px;width:100%;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
        .modal h2{font-family:Georgia,serif;font-size:26px;font-weight:400;margin-bottom:6px}
        .modal .sub{color:var(--txt2);font-size:13px;margin-bottom:18px}
        .modal .close{float:right;background:transparent;border:0;color:var(--txt3);font-size:22px;cursor:pointer;line-height:1}
        .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
        .stat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
        .stat .n{font-family:Georgia,serif;font-size:26px;color:var(--orange)}
        .stat .l{font-size:10px;letter-spacing:.15em;color:var(--txt3);text-transform:uppercase;margin-top:4px}
        .hlist{max-height:460px;overflow-y:auto;margin-top:6px}
        .hitem{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
        .hitem .top{display:flex;justify-content:space-between;align-items:center;font-size:13px}
        .hitem .teams2{font-weight:700}
        .hitem .res-badge{font-size:10px;padding:3px 9px;border-radius:999px;letter-spacing:.08em;font-weight:700}
        .res-badge.exact{background:rgba(0,255,136,.16);color:var(--green);border:1px solid rgba(0,255,136,.35)}
        .res-badge.wdl{background:rgba(255,182,72,.16);color:var(--gold);border:1px solid rgba(255,182,72,.35)}
        .res-badge.miss{background:rgba(244,63,94,.16);color:var(--red);border:1px solid rgba(244,63,94,.35)}
        .res-badge.pending{background:rgba(139,92,246,.16);color:var(--purple);border:1px solid rgba(139,92,246,.35)}
        .hitem .multi{display:inline-block;font-size:10px;color:var(--blue);background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.35);padding:1px 6px;border-radius:6px;margin-left:6px}
        .hitem .meta{font-size:11px;color:var(--txt3);margin-top:6px}
        .hitem .row2{display:flex;gap:8px;align-items:center;margin-top:8px}
        .hitem input{padding:7px 10px;font-size:13px;text-align:center}
        .hitem button{padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--txt2);font-size:12px;cursor:pointer}
        .hitem button:hover{border-color:var(--orange);color:var(--orange)}
        .batch-opts{display:flex;gap:8px;margin:12px 0}
        .batch-opts button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--txt2);cursor:pointer;font-weight:700}
        .batch-opts button.on{border-color:var(--orange);background:rgba(255,107,53,.14);color:var(--orange)}
        .quota{font-size:12px;padding:8px 12px;border-radius:8px;margin-top:10px;text-align:center}
        .quota.ok{background:rgba(0,255,136,.1);color:var(--green)}
        .quota.warn{background:rgba(255,182,72,.12);color:var(--gold)}
        .quota.bad{background:rgba(244,63,94,.12);color:var(--red)}
        .toast-wrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
        .toast{background:#0d1522;border:1px solid var(--line2);color:var(--txt);padding:12px 18px;border-radius:12px;font-size:13px;box-shadow:0 12px 34px rgba(0,0,0,.5);animation:slidein .3s ease}
        .toast.ok{border-color:rgba(0,255,136,.5)} .toast.ok::before{content:"✅ ";margin-right:4px}
        .toast.warn{border-color:rgba(255,182,72,.5)} .toast.warn::before{content:"⚠️ ";margin-right:4px}
        .toast.err{border-color:rgba(244,63,94,.5)} .toast.err::before{content:"❌ ";margin-right:4px}
        @keyframes slidein{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
        .verbar{position:fixed;top:0;left:0;right:0;z-index:300;background:#ffb648;color:#000;padding:8px 16px;font-size:13px;text-align:center;font-weight:600}
    </style>
</head>
<body>

<div class="wrap">
    <div class="hero">
        <div class="kick">Premier League 2026/27</div>
        <h1>英超 <em>预测</em> 引擎</h1>
        <p>规则工程 + 前端工程 + 自动化 · v3.2</p>
    </div>

    <div class="dash">
        <div class="cell"><div class="lbl">当前轮次</div><div class="val orange" id="dashRound">—</div></div>
        <div class="cell"><div class="lbl">已完赛</div><div class="val" id="dashPlayed">—</div></div>
        <div class="cell"><div class="lbl">本轮待预测</div><div class="val blue" id="dashPending">—</div></div>
        <div class="cell"><div class="lbl">待录入赛果</div><div class="val" id="dashRecord">—</div></div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Groq API Key</h3>
            <div class="field">
                <input type="password" id="apiKey" placeholder="gsk_... 只存本地浏览器">
            </div>
            <div style="display:flex;gap:8px;margin-bottom:18px">
                <button class="btn ghost" style="flex:1" onclick="saveKey()">保存</button>
                <button class="btn ghost" style="flex:1" onclick="clearKey()">清除</button>
            </div>

            <h3>比赛选择</h3>
            <div class="field">
                <label>轮次</label>
                <select id="roundSel"></select>
            </div>
            <div class="field">
                <label>对阵</label>
                <select id="matchSel"></select>
            </div>

            <h3 style="margin-top:18px">今日情报（可选）</h3>
            <div class="field">
                <textarea id="intel" placeholder="例：萨利巴背伤缺席；利物浦无锋阵；福登停赛..."></textarea>
            </div>

            <button class="btn" id="predictBtn" onclick="startPredict()">开始预测</button>
        </div>

        <div class="card" id="resultCard">
            <div class="empty">选择比赛 → 填写情报 → 开始预测</div>
        </div>
    </div>

    <div class="card" style="margin-top:22px">
        <h3>积分榜</h3>
        <div class="standings" id="standings"><div class="empty">加载中…</div></div>
    </div>
</div>

<button class="fab hist" onclick="openHistory()">📊<span class="badge-n" id="histBadge" style="display:none">0</span></button>
<button class="fab batch" onclick="openBatch()">⚡</button>
<button class="fab top" id="topBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<div class="mask" id="histMask">
    <div class="modal">
        <button class="close" onclick="closeHistory()">✕</button>
        <h2>历史记录与命中率</h2>
        <div class="sub">录入实际赛果，自动判定命中</div>
        <div class="stats">
            <div class="stat"><div class="n" id="sTotal">0</div><div class="l">总预测</div></div>
            <div class="stat"><div class="n" id="sDone">0</div><div class="l">已录入</div></div>
            <div class="stat"><div class="n" id="sWdl">0%</div><div class="l">胜平负</div></div>
            <div class="stat"><div class="n" id="sExact">0%</div><div class="l">精确比分</div></div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:14px">
            <button class="btn ghost" onclick="exportHistory()">导出 JSON</button>
            <button class="btn ghost" onclick="importHistory()">导入 JSON</button>
            <button class="btn ghost" onclick="clearHistory()">清空</button>
        </div>
        <div class="hlist" id="histList"></div>
    </div>
</div>

<div class="mask" id="batchMask">
    <div class="modal">
        <button class="close" onclick="closeBatch()">✕</button>
        <h2>批量预测</h2>
        <div class="sub">对当前轮次全部比赛进行预测</div>
        <div class="batch-opts" id="batchOpts">
            <button data-n="1" class="on">每场 1 次</button>
            <button data-n="3">每场 3 次</button>
            <button data-n="5">每场 5 次</button>
        </div>
        <div class="quota ok" id="batchQuota">预计消耗 10 次调用</div>
        <button class="btn" id="batchBtn" onclick="runBatch()">开始批量预测</button>
    </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
    /* ========================================================
       0. 常量
    ======================================================== */
    const EXPECTED_SKILL_VERSION = '2.1.0';
    const GROQ_URL = 'https://api.groq.com/openai/v1/chat/completions';
    // ⚠️ 8B 版本免费额度 20000 TPM，能装下完整 skill.md
    const GROQ_MODEL = 'llama-3.1-8b-instant';

    const ABBR = {
        '阿森纳':'ARS','曼城':'MCI','利物浦':'LIV','切尔西':'CHE','热刺':'TOT','曼联':'MUN',
        '纽卡斯尔联':'NEW','阿斯顿维拉':'AVL','布莱顿':'BHA','埃弗顿':'EVE','富勒姆':'FUL',
        '水晶宫':'CRY','布伦特福德':'BRE','伯恩茅斯':'BOU','诺丁汉森林':'NFO','利兹联':'LEE',
        '桑德兰':'SUN','考文垂城':'COV','赫尔城':'HUL','伊普斯维奇镇':'IPS'
    };
    const ESPN_IDS = {
        '阿森纳':359,'曼城':382,'利物浦':364,'切尔西':363,'热刺':367,'曼联':360,
        '纽卡斯尔联':361,'阿斯顿维拉':362,'布莱顿':331,'埃弗顿':368,'富勒姆':370,
        '水晶宫':384,'布伦特福德':337,'伯恩茅斯':349,'诺丁汉森林':393,'利兹联':357,
        '桑德兰':366,'考文垂城':388,'赫尔城':306,'伊普斯维奇镇':373

    /* ========================================================
       2. 校验 + 归一化
    ======================================================== */
    function validateAndNormalizePrediction(raw) {
        const errors = [], warnings = [];
        const data = JSON.parse(JSON.stringify(raw));

        const required = ['homeWin','draw','awayWin','score','confidence','keyFactors','analysis'];
        for (const k of required) {
            if (data[k] === undefined || data[k] === null) errors.push(`缺少字段：${k}`);
        }
        if (errors.length) return { ok:false, errors, warnings, data };

        let h = Number(data.homeWin), d = Number(data.draw), a = Number(data.awayWin);
        if (![h,d,a].every(Number.isFinite)) {
            errors.push('概率字段不是数字');
            return { ok:false, errors, warnings, data };
        }

        const sum = h + d + a;
        const diff = Math.abs(sum - 100);

        if (diff > 2) {
            warnings.push(`概率总和 ${sum}，偏差 ${diff.toFixed(1)} > 2，判定为无效`);
            return { ok:false, errors, warnings, data, hardFail:true };
        }

        if (diff > 0) {
            const f = 100 / sum;
            const r = [Math.round(h*f*100), Math.round(d*f*100), Math.round(a*f*100)];
            const delta = 10000 - (r[0]+r[1]+r[2]);
            r[0] += delta;
            data.homeWin = r[0]/100; data.draw = r[1]/100; data.awayWin = r[2]/100;
            warnings.push(`概率已归一化：原总和 ${sum}`);
        }

        if (!Array.isArray(data.keyFactors)) warnings.push('keyFactors 不是数组');
        if (data.headToHead && typeof data.headToHead === 'object') {
            const note = data.headToHead.note;
            if (note && !['估算','资料库','今日情报'].includes(note)) {
                warnings.push(`headToHead.note 非法值：${note}`);
            }
            if (!Array.isArray(data.headToHead.lastMatches)) warnings.push('headToHead.lastMatches 不是数组');
        } else {
            warnings.push('headToHead 缺失');
        }

        return { ok:true, errors, warnings, data };
    }

    /* ========================================================
       5. skill.md 加载
    ======================================================== */
    let _skillCache = null;
    let _verBarShown = false;
    async function loadSkill(){
        if (_skillCache) return _skillCache;
        const res = await fetch(`skill.md?v=${Date.now()}`, { cache:'no-store' });
        if (!res.ok) throw new Error(`skill.md 加载失败：HTTP ${res.status}`);
        const text = await res.text();

        const vm = text.match(/v(\d+\.\d+\.\d+)/);
        const actualVersion = vm ? vm[1] : null;
        if (actualVersion !== EXPECTED_SKILL_VERSION && !_verBarShown) {
            console.warn(`⚠️ skill.md 版本不符\n期望：${EXPECTED_SKILL_VERSION}\n实际：${actualVersion ?? '未找到'}`);
            const bar = document.createElement('div');
            bar.className = 'verbar';
            bar.textContent = `⚠️ skill.md 版本不符（期望 ${EXPECTED_SKILL_VERSION}，实际 ${actualVersion ?? '未知'}）`;
            document.body.appendChild(bar);
            _verBarShown = true;
        }
        _skillCache = text;
        return text;
    }

    /* ========================================================
       6. Groq 调用（429 自动重试）
    ======================================================== */
    async function callGroq(systemPrompt, userPrompt, maxRetry = 3) {
        const key = getKey();
        if (!key) throw new Error('未设置 API Key');

        let delay = 1500;
        for (let attempt = 0; attempt <= maxRetry; attempt++) {
            const resp = await fetch(GROQ_URL, {
                method:'POST',
                headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key },
                body: JSON.stringify({
                    model: GROQ_MODEL,
                    messages: [
                        { role:'system', content: systemPrompt },
                        { role:'user',   content: userPrompt }
                    ],
                    temperature: 0.2,
                    response_format: { type: 'json_object' }
                })
            });
            if (resp.status === 429 && attempt < maxRetry) {
                await new Promise(r => setTimeout(r, delay));
                delay *= 2;
                continue;
            }
            if (!resp.ok) {
                const txt = await resp.text();
                throw new Error(`Groq ${resp.status}: ${txt.slice(0,240)}`);
            }
            const j = await resp.json();
            return j.choices?.[0]?.message?.content || '';
        }
        throw new Error('Groq 重试耗尽');
    }

        const r = +document.getElementById('roundSel').value || 0;

    /* ========================================================
       8. 预测流程
    ======================================================== */
    async function startPredict(){
        const btn = document.getElementById('predictBtn');
        const { round, home, away } = currentMatch();
        if (!home || !away) return toast('未选择比赛', 'warn');
        const intel = document.getElementById('intel').value.trim();

        if (!getKey()) return toast('请先填 Groq API Key', 'warn');

        btn.disabled = true;
        const card = document.getElementById('resultCard');
        card.innerHTML = `
    <div class="loader">
      <div class="ball"></div>
      <div class="msg">模型推理中…（第一次约 10 秒）</div>
    </div>`;

        try {
            const skill = await loadSkill();
            const userPrompt =
                (intel ? `【今日情报】\n${intel}\n\n` : '') +
                `【预测指令】\n请预测：第 ${round+1} 轮  ${home} vs ${away}\n` +
                `严格按 skill.md 输出契约返回 JSON。`;

            const raw = await callGroq(skill, userPrompt);

            let parsed;
            try { parsed = JSON.parse(raw); }
            catch(e){
                card.innerHTML = `<div class="empty">❌ 模型返回非 JSON<br><pre style="white-space:pre-wrap;font-size:12px;color:#888;margin-top:12px">${raw.slice(0,500)}</pre></div>`;
                return toast('模型返回非 JSON，请重试', 'err');
            }

            const v = validateAndNormalizePrediction(parsed);
            if (!v.ok) {
                card.innerHTML = `<div class="empty">❌ 校验失败<br>${v.errors.join('<br>')}<br>${v.warnings.join('<br>')}</div>`;
                return toast('预测校验失败', 'err');
            }
            if (v.warnings.length) console.warn('校验警告：', v.warnings);

            renderResult(v.data, { round, home, away, intel });
            addHistory({ round, home, away, ...v.data, ts: Date.now() });
            toast('预测完成');
        } catch(err) {
            console.error(err);
            card.innerHTML = `<div class="empty">❌ ${err.message}</div>`;
            toast(err.message.slice(0, 80), 'err');
        } finally {
            btn.disabled = false;
        }
    }

        }
        const rows = list.map((s,i) => {
            const cls = i < 4 ? 'ucl' : i >= list.length - 3 ? 'rel' : '';
            return `<tr class="${cls}">
      <td>${i+1}</td>
      <td>${s.team}</td>
      <td>${s.played ?? 0}</td>
      <td>${s.won ?? 0}</td>
      <td>${s.drawn ?? 0}</td>
      <td>${s.lost ?? 0}</td>
      <td>${s.gf ?? 0}:${s.ga ?? 0}</td>
      <td style="color:#ffb648;font-weight:700">${s.points ?? 0}</td>
    </tr>`;
        }).join('');
        document.getElementById('standings').innerHTML = `
    <table>
      <thead><tr><th>#</th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>进:失</th><th>分</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
    }

    /* ========================================================
       11. 仪表盘
    ======================================================== */
    function refreshDashboard(){
        const r = +document.getElementById('roundSel').value || 0;
        document.getElementById('dashRound').textContent = '第 ' + (r+1) + ' 轮';

        document.getElementById('dashPlayed').textContent = Object.keys(RESULTS).length;

        const hist = getHistory();
        const roundFixtures = FIXTURES[r] || [];
        const predicted = new Set(hist.filter(h => h.round === r).map(h => `${h.home}|${h.away}`));
        const pending = Math.max(0, roundFixtures.length - predicted.size);
        document.getElementById('dashPending').textContent = pending;

        const toRecord = hist.filter(h => !h.actual).length;
        document.getElementById('dashRecord').textContent = toRecord;

        const badge = document.getElementById('histBadge');
        if (toRecord > 0) { badge.style.display = 'flex'; badge.textContent = toRecord; }
        else { badge.style.display = 'none'; }
    }

    /* ========================================================
       12. 历史记录
    ======================================================== */
    const HIST_KEY = 'pl_history_v1';
    function getHistory(){
        try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); }
        catch { return []; }
    }
    function setHistory(list){
        if (list.length > 500) toast('记录超过 500 条，建议导出后清空', 'warn');
        localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(-800)));
    }
    function addHistory(rec){
        const list = getHistory();
        list.push(rec);
        setHistory(list);
        refreshDashboard();
        if (document.getElementById('histMask').classList.contains('show')) renderHistory();
    }
    function judge(rec){
        if (!rec.actual) return 'pending';
        if (rec.actual === rec.score) return 'exact';
        const wdl = s => {
            const [a,b] = s.split('-').map(Number);
            return a>b ? 'H' : a<b ? 'A' : 'D';
        };
        return wdl(rec.actual) === wdl(rec.score) ? 'wdl' : 'miss';
    }
    function renderHistory(){
        const raw = getHistory();
        const list = raw.slice().reverse();
        const box = document.getElementById('histList');
        if (!list.length) { box.innerHTML = '<div class="empty">暂无记录</div>'; return; }

        box.innerHTML = list.map((h,idx) => {
            const realIdx = raw.length - 1 - idx;
            const j = judge(h);
            const labels = { exact:'精确命中', wdl:'胜平负命中', miss:'未命中', pending:'待录入' };
            const multi = h._multi && h._multi > 1 ? `<span class="multi">×${h._multi}</span>` : '';
            return `<div class="hitem">
      <div class="top">
        <div class="teams2">${h.home} vs ${h.away}${multi}</div>
        <div class="res-badge ${j}">${labels[j]}</div>
      </div>
      <div class="meta">预测 ${h.score} · ${h.homeWin}% / ${h.draw}% / ${h.awayWin}% · 第${h.round+1}轮 · ${new Date(h.ts).toLocaleString('zh-CN')}</div>
      <div class="row2">
        <input placeholder="实际比分 如 2-1" value="${h.actual || ''}"
          onchange="setActual(${realIdx}, this.value)">
        <button onclick="delHistory(${realIdx})">删除</button>
      </div>
    </div>`;
        }).join('');

        const total = raw.length;
        const done = raw.filter(h=>h.actual).length;
        const wdl = raw.filter(h=>['wdl','exact'].includes(judge(h))).length;
        const exact = raw.filter(h=>judge(h)==='exact').length;
        document.getElementById('sTotal').textContent = total;
        document.getElementById('sDone').textContent = done;
        document.getElementById('sWdl').textContent = done ? Math.round(wdl/done*100)+'%' : '0%';
        document.getElementById('sExact').textContent = done ? Math.round(exact/done*100)+'%' : '0%';
    }
    function setActual(idx, val){
        const list = getHistory();
        if (!list[idx]) return;
        val = val.trim();
        if (val && !/^\d+-\d+$/.test(val)) return toast('格式应为 2-1', 'warn');
        list[idx].actual = val || undefined;
        setHistory(list);
        renderHistory();
        refreshDashboard();
    }
    function delHistory(idx){
        const list = getHistory();
        list.splice(idx,1);
        setHistory(list);
        renderHistory();
        refreshDashboard();
    }
    function clearHistory(){
        if (!confirm('确定清空全部历史记录？')) return;
        localStorage.removeItem(HIST_KEY);
        renderHistory();
        refreshDashboard();
    }
    function exportHistory(){
        const blob = new Blob([JSON.stringify(getHistory(), null, 2)], {type:'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `pl-history-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }
    function importHistory(){
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = '.json';
        inp.onchange = e => {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = () => {
                try {
                    const arr = JSON.parse(r.result);
                    if (!Array.isArray(arr)) throw 0;
                    setHistory(arr);
                    renderHistory();
                    refreshDashboard();
                    toast('导入成功');
                } catch { toast('导入失败：文件格式错误', 'err'); }
            };
            r.readAsText(f);
        };
        inp.click();
    }
    function openHistory(){ document.getElementById('histMask').classList.add('show'); renderHistory(); }
    function closeHistory(){ document.getElementById('histMask').classList.remove('show'); }

    /* ========================================================
       13. 批量预测
    ======================================================== */
    let batchN = 1;
    function openBatch(){ document.getElementById('batchMask').classList.add('show'); updateQuota(); }
    function closeBatch(){ document.getElementById('batchMask').classList.remove('show'); }
    function updateQuota(){
        const calls = 10 * batchN;
        const el = document.getElementById('batchQuota');
        el.className = 'quota ' + (calls <= 20 ? 'ok' : calls <= 50 ? 'warn' : 'bad');
        el.textContent = `预计消耗 ${calls} 次调用（Groq 每天 1000 次）`;
    }
    document.getElementById('batchOpts').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        batchN = +b.dataset.n;
        document.querySelectorAll('#batchOpts button').forEach(x => x.classList.toggle('on', x === b));
        updateQuota();
    });

    function mode(arr){
        const m = new Map();
        arr.forEach(x => m.set(x, (m.get(x)||0)+1));
        let best = null, bestN = 0;
        for (const [k,v] of m) if (v > bestN) { best = k; bestN = v; }
        return best;
    }

    async function runBatch(){
        const btn = document.getElementById('batchBtn');
        if (!getKey()) return toast('请先填 Groq API Key', 'warn');
        const r = +document.getElementById('roundSel').value || 0;
        const round = FIXTURES[r] || [];
        if (!round.length) return toast('本轮无赛程', 'warn');

        const calls = round.length * batchN;
        if (calls > 30 && !confirm(`将消耗约 ${calls} 次 API 调用，确认？`)) return;

        btn.disabled = true;
        btn.textContent = '批量运行中…';
        const intel = document.getElementById('intel').value.trim();
        let ok = 0, fail = 0;

        try {
            const skill = await loadSkill();
            for (let i = 0; i < round.length; i++) {
                const { home, away } = round[i];
                const runs = [];
                for (let k = 0; k < batchN; k++) {
                    try {
                        const userPrompt =
                            (intel ? `【今日情报】\n${intel}\n\n` : '') +
                            `【预测指令】\n请预测：第 ${r+1} 轮  ${home} vs ${away}\n严格按 skill.md 输出契约返回 JSON。`;
                        const raw = await callGroq(skill, userPrompt);
                        const p = JSON.parse(raw);
                        const v = validateAndNormalizePrediction(p);
                        if (v.ok) runs.push(v.data);
                    } catch(e){ /* 忽略单次失败 */ }
                }
                if (runs.length) {
                    const agg = {
                        homeWin: Math.round(runs.reduce((s,x)=>s+x.homeWin,0)/runs.length*100)/100,
                        draw:    Math.round(runs.reduce((s,x)=>s+x.draw,0)/runs.length*100)/100,
                        awayWin: Math.round(runs.reduce((s,x)=>s+x.awayWin,0)/runs.length*100)/100,
                        score: mode(runs.map(x=>x.score)),
                        confidence: mode(runs.map(x=>x.confidence)),
                        keyFactors: runs[0].keyFactors,
                        analysis: runs[0].analysis,
                        headToHead: runs[0].headToHead,
                        _multi: batchN
                    };
                    addHistory({ round:r, home, away, ...agg, ts:Date.now() });
                    ok++;
                } else { fail++; }
            }
            toast(`批量完成：成功 ${ok} 场${fail?`，失败 ${fail} 场`:''}`, fail?'warn':'ok');
            closeBatch();
            refreshDashboard();
        } catch(err){
            toast(err.message.slice(0, 80), 'err');
        } finally {
            btn.disabled = false;
            btn.textContent = '开始批量预测';
        }
    }

    /* ========================================================
       14. 返回顶部按钮
    ======================================================== */
    window.addEventListener('scroll', () => {
        document.getElementById('topBtn').classList.toggle('show', window.scrollY > 400);
    });

    /* ========================================================
       15. 启动
    ======================================================== */
    (function boot(){
        const saved = localStorage.getItem('groq_key');
        if (saved) document.getElementById('apiKey').value = saved;

        initSelectors();
        renderStandings(STATIC_STANDINGS);
        refreshDashboard();
    })();
</script>
</body>
</html>
