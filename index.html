    </section>

    <section id="fplSection" style="margin-bottom:var(--sp-8)">
        <div id="fplLoading" class="fpl-card" style="height:200px;background:linear-gradient(90deg,rgba(255,255,255,.03) 0%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.03) 100%);background-size:200% 100%;animation:loadingShimmer 1.5s infinite"></div>
        <div id="fplContent" style="display:none">
            <div class="fpl-header"><h2>FPL 最佳阵容 <span id="fplGW">-</span></h2>
                <div class="fpl-meta"><span>预测总分: <b id="fplXPts">-</b></span></div>
            </div>
            <div class="fpl-card" style="margin-bottom:0;border-radius:0 0 var(--r-2xl) var(--r-2xl);border-top:none;padding-top:0;box-shadow:none">
                <div class="fpl-pitch" id="fplPitch"></div>
            </div>
        </div>
    </section>

    <section class="focus-strip" id="focusStrip"><h4>今日焦点战</h4>
        <div class="focus-scroll-wrap" id="focusWrap">
            <button class="focus-arrow left" id="focusPrev"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
            <div class="focus-scroll" id="focusScroll"><div class="focus-empty">加载中…</div></div>
            <button class="focus-arrow right" id="focusNext"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
        </div>
    </section>

    <section class="dash fade-in">
        <div class="cell primary"><div class="lbl">🏆 当前轮次</div><div class="val orange" id="dashRound">—</div></div>
        <div class="cell"><div class="lbl">⚽ 已完赛</div><div class="val" id="dashPlayed">—</div></div>
        <div class="cell"><div class="lbl">🎯 待预测</div><div class="val blue" id="dashPending">—</div></div>
        <div class="cell"><div class="lbl">📝 待录入</div><div class="val" id="dashRecord">—</div></div>
    </section>

    <div class="warn-banner" id="fallbackBanner">⚠️ <b>data.json 加载失败</b>，请运行<code>update.bat</code>。</div>

    <div class="grid">
        <div class="card fade-in">
            <h3>AI 预测引擎 (Groq)</h3>
            <div class="field">
                <div class="input-row"><input type="password" id="apiKey" placeholder="gsk_... 只存本地" autocomplete="off"></div>
            </div>
            <div style="display:flex;gap:var(--sp-2);margin-bottom:var(--sp-6)">
                <button class="btn ghost" style="flex:1" onclick="saveKey()">保存</button>
                <button class="btn ghost" style="flex:1" onclick="clearKey()">清除</button>
            </div>

            <h3>比赛选择</h3>
            <div class="field" id="roundSelectWrap"><label>轮次</label><select id="roundSel"></select></div>
            <div class="field"><label>对阵</label><select id="matchSel"></select></div>

            <h3 style="margin-top:var(--sp-6)">今日情报（可选）</h3>
            <div class="field"><textarea id="intel" maxlength="300" placeholder="例：萨利巴背伤缺席；利物浦无锋阵..."></textarea></div>

            <button class="btn" id="predictBtn" onclick="startPredict()">⚡ 生成 AI 深度预测</button>
            <button class="btn bzzorio-btn" id="bzzorioBtn" onclick="showBzzorioResult()">📊 直接查看底层数据模型结果</button>
        </div>
        <div class="card fade-in" id="resultCard">
            <div class="empty">
                <div class="empty-ball"></div>
                <div>选择比赛 → 填写情报 → 开始预测</div>
            </div>
        </div>
    </div>

    <div class="card fade-in reveal" style="margin-top:var(--sp-6)"><h3>积分榜</h3>
        <div class="standings" id="standings"><div class="empty">等待数据加载...</div></div>
    </div>
</div>

<div class="fab-hub" id="fabHub">
    <button class="fab-core" id="fabCore" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <div class="core-ball"></div>
    </button>
</div>

<div class="mask" id="histMask" role="dialog" aria-modal="true">
    <div class="modal" tabindex="-1">
        <button class="close" onclick="closeHistory()" aria-label="关闭">✕</button>
        <h2>历史记录</h2>
        <div class="hlist" id="histList"></div>
    </div>
</div>

<div class="toast-wrap" id="toastWrap" role="status" aria-live="polite"></div>

<script>
    const state = { fixtures: [], teams: [], currentRound: 1 };
    const HIST_KEY = 'pl_history_v2';

    function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function toast(msg, type='ok') {
        const el = document.createElement('div');
        el.className = 'toast ' + type;
        el.textContent = msg;
        document.getElementById('toastWrap').appendChild(el);
        setTimeout(() => el.remove(), 3500);
    }

    function saveKey() {
        const k = document.getElementById('apiKey').value.trim();
        if (!k) return toast('请输入 API Key', 'warn');
        localStorage.setItem('groq_key', k);
        toast('已保存');
    }
    function clearKey() {
        localStorage.removeItem('groq_key');
        document.getElementById('apiKey').value = '';
        toast('已清除', 'warn');
    }
    function getKey() { return localStorage.getItem('groq_key') || ''; }

    // ================== 数据加载与 UI 渲染 ==================
    async function loadData() {
        try {
            const res = await fetch(`data.json?v=${Date.now()}`, {cache: 'no-store'});
            if (!res.ok) throw new Error('Fetch failed');
            const data = await res.json();

            if (data.fixtures) state.fixtures = data.fixtures;
            if (data.teams) state.teams = data.teams;

            const today = new Date();
            const upcoming = state.fixtures.find(f => new Date(f.kickoff) > today && !f.finished);
            state.currentRound = upcoming ? upcoming.round : 1;

            document.getElementById('fallbackBanner').classList.remove('show');
            initSelectors();
            refreshDashboard();
            renderFocusMatches();
            renderStandings(data.standings || []);
        } catch(e) {
            document.getElementById('fallbackBanner').classList.add('show');
        }
    }

    function initSelectors() {
        const rounds = Array.from(new Set(state.fixtures.map(f => f.round))).sort((a,b)=>a-b);
        const rs = document.getElementById('roundSel');
        rs.innerHTML = rounds.map(r => `<option value="${r}" ${r===state.currentRound?'selected':''}>第 ${r} 轮</option>`).join('');

        updateMatchList();
        rs.onchange = () => {
            state.currentRound = +rs.value;
            updateMatchList();
        };
        document.getElementById('matchSel').onchange = checkBzzorio;
    }

    function updateMatchList() {
        const fx = state.fixtures.filter(f => f.round === state.currentRound);
        document.getElementById('matchSel').innerHTML = fx.map((f, i) => `<option value="${i}">${f.home} vs ${f.away}</option>`).join('');
        checkBzzorio();
    }

    function checkBzzorio() {
        const idx = +document.getElementById('matchSel').value;
        const fx = state.fixtures.filter(f => f.round === state.currentRound)[idx];
        const btn = document.getElementById('bzzorioBtn');
        if (fx && fx.predictions) {
            btn.style.display = 'block';
        } else {
            btn.style.display = 'none';
        }
    }

    function refreshDashboard() {
        document.getElementById('dashRound').textContent = '第 ' + state.currentRound + ' 轮';
        document.getElementById('dashPlayed').textContent = state.fixtures.filter(f => f.finished).length;
        document.getElementById('dashPending').textContent = state.fixtures.filter(f => !f.finished && f.round === state.currentRound).length;
    }

    function renderFocusMatches() {
        const scroll = document.getElementById('focusScroll');
        const fx = state.fixtures.filter(f => f.round === state.currentRound).slice(0, 8);
        if (!fx.length) { scroll.innerHTML = '<div class="focus-empty">本轮无赛程</div>'; return; }

        scroll.innerHTML = fx.map(f => `
            <div class="fmatch" onclick="document.getElementById('roundSel').value='${f.round}';document.getElementById('roundSel').onchange();">
                <div class="tagline"><span class="tag-sm top">待预测</span></div>
                <div class="frow"><span class="fname">${escapeHtml(f.home)}</span></div>
                <div class="frow"><span class="fname">${escapeHtml(f.away)}</span></div>
                <div class="fmeta"><span>第 ${f.round} 轮</span><span class="ftime">${new Date(f.kickoff).toLocaleDateString()}</span></div>
            </div>
        `).join('');
    }

    function renderStandings(list) {
        if (!list || !list.length) return;
        const rows = list.map((s, i) => {
            const cls = i < 4 ? 'ucl' : i >= list.length - 3 ? 'rel' : '';
            const abbr = s.team.slice(0,3).toUpperCase();
            return `<tr class="${cls}">
                <td>${i + 1}</td>
                <td><span class="mini-badge-wrap"><span class="mini-fallback">${abbr}</span></span><span class="team-name">${escapeHtml(s.team)}</span></td>
                <td>${s.played ?? 0}</td><td>${s.won ?? 0}</td><td>${s.drawn ?? 0}</td><td>${s.lost ?? 0}</td>
                <td>${s.gf ?? 0}:${s.ga ?? 0}</td><td style="color:#fbbf24;font-weight:700">${s.points ?? 0}</td>
            </tr>`;
        }).join('');
        document.getElementById('standings').innerHTML = `<table><thead><tr><th>#</th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>进:失</th><th>分</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    // ================== 预测核心逻辑 ==================
    function setReasoningStep(step) {
        const steps = ['读取底层数据','加载 Bzzorio xG','构建 Dixon-Coles 矩阵','生成最终报告'];
        document.getElementById('resultCard').innerHTML = `<div class="reasoning">
            <div class="reasoning-ball"></div>
            <div style="font-family:var(--font-serif);font-size:20px;">AI 正在融合数据...</div>
            <ul class="reasoning-steps">
                ${steps.map((s,i)=>`<li class="${i<=step?'active':''}">${s}</li>`).join('')}
            </ul>
            <div class="reasoning-bar"><div class="reasoning-bar-fill" style="width:${(step/4)*100}%"></div></div>
        </div>`;
    }

    async function startPredict() {
        const btn = document.getElementById('predictBtn');
        const key = getKey();
        if(!key) return toast('请先在左侧填入 Groq API Key，或直接点下方绿色按钮看数据模型', 'warn');

        const idx = +document.getElementById('matchSel').value;
        const fx = state.fixtures.filter(f => f.round === state.currentRound)[idx];
        if(!fx) return toast('比赛不存在', 'warn');
        if(fx.finished) return toast('该比赛已结束', 'warn');

        const intel = document.getElementById('intel').value.trim();

        btn.disabled = true;
        let step = 0;
        setReasoningStep(0);
        const timer = setInterval(() => { step++; if(step<4) setReasoningStep(step); }, 800);

        try {
            let bzzorioContext = '';
            if(fx.predictions) {
                bzzorioContext = `底层模型已计算出：最可能比分 ${fx.predictions.score}，主胜概率 ${fx.predictions.homeWin}%，平局 ${fx.predictions.draw}%，客胜 ${fx.predictions.awayWin}%，xG对比 ${fx.predictions.xgHome} vs ${fx.predictions.xgAway}。`;
            }

            const prompt = `比赛：${fx.home} vs ${fx.away}。
${bzzorioContext}
今日情报：${intel || '无'}。
请严格按照 JSON 格式返回预测结果，必须包含：score(比分), homeWin/draw/awayWin(百分比), confidence(高/中高/中/低), keyFactors(最多4条), analysis(最多60字)。`;

            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
                body: JSON.stringify({
                    model: 'openai/gpt-oss-120b',
                    messages: [{ role: 'system', content: '你是英超预测专家，必须只输出 JSON。' }, { role: 'user', content: prompt }],
                    temperature: 0.3,
                    max_tokens: 2048
                })
            });

            if(!res.ok) throw new Error('API 请求失败，请检查 Key');
            const json = await res.json();
            let raw = json.choices[0].message.content;

            clearInterval(timer);
            setReasoningStep(4);
            await new Promise(r=>setTimeout(r,300));

            const start = raw.indexOf('{');
            const end = raw.lastIndexOf('}');
            if(start===-1 || end===-1) throw new Error('模型未返回 JSON 格式');
            const data = JSON.parse(raw.slice(start, end+1));

            renderResultUI(fx, data);

        } catch(e) {
            clearInterval(timer);
            document.getElementById('resultCard').innerHTML = `<div class="empty" style="color:var(--rose)">❌ ${e.message}</div>`;
            toast('预测失败', 'err');
        } finally {
            btn.disabled = false;
        }
    }

    function showBzzorioResult() {
        const idx = +document.getElementById('matchSel').value;
        const fx = state.fixtures.filter(f => f.round === state.currentRound)[idx];
        if(!fx || !fx.predictions) return;

        const data = {
            score: fx.predictions.score,
            homeWin: fx.predictions.homeWin,
            draw: fx.predictions.draw,
            awayWin: fx.predictions.awayWin,
            confidence: '高',
            keyFactors: fx.predictions.factors || ['基于 Dixon-Coles', '包含实时 xG'],
            analysis: fx.predictions.analysis || '暂无详细分析'
        };
        renderResultUI(fx, data);
    }

    function renderResultUI(fx, data) {
        const hw = data.homeWin || 33, dr = data.draw || 33, aw = data.awayWin || 34;
        const C = 2 * Math.PI * 42;

        document.getElementById('resultCard').innerHTML = `
            <div class="scoreboard">
                <div class="teams">
                    <div class="team left">
                        <div class="badge-wrap"><div class="fallback">${fx.home.slice(0,3).toUpperCase()}</div></div>
                        <div class="nm">${escapeHtml(fx.home)}</div>
                    </div>
                    <div class="score">${data.score || '1-0'}</div>
                    <div class="team right">
                        <div class="badge-wrap"><div class="fallback">${fx.away.slice(0,3).toUpperCase()}</div></div>
                        <div class="nm">${escapeHtml(fx.away)}</div>
                    </div>
                </div>
                <div style="margin-top:16px;color:var(--amber);font-size:12px;font-weight:600;">置信度: ${data.confidence || '中'}</div>
            </div>

            <div class="rings">
                <div class="ring h"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle class="bar" cx="50" cy="50" r="42" stroke="var(--amber)" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-hw/100)}"/></svg><div class="lbl2">主胜</div><div class="num">${hw}%</div></div>
                <div class="ring d"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle class="bar" cx="50" cy="50" r="42" stroke="#94a3b8" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-dr/100)}"/></svg><div class="lbl2">平局</div><div class="num">${dr}%</div></div>
                <div class="ring a"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle class="bar" cx="50" cy="50" r="42" stroke="var(--cyan)" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-aw/100)}"/></svg><div class="lbl2">客胜</div><div class="num">${aw}%</div></div>
            </div>

            <div class="sect">
                <div class="ttl">关键因素</div>
                <div class="factors">
                    ${(data.keyFactors||[]).map(f=>`<span class="chip">${escapeHtml(f)}</span>`).join('')}
                </div>
                <div class="kv" style="font-size:14px;line-height:1.8;color:var(--text-2);">${escapeHtml(data.analysis||'')}</div>
            </div>
        `;
    }

    // ================== FPL 渲染 (100% 不裂图) ==================
    async function loadFPL() {
        try {
            const res = await fetch('fpl.json?v=' + Date.now());
            if(!res.ok) throw 0;
            const data = await res.json();
            if(!data || !data.recommendedSquad) throw 0;
            const sq = data.recommendedSquad;
            document.getElementById('fplGW').textContent = data.nextEvent.id;
            document.getElementById('fplXPts').textContent = sq.totalXPts.toFixed(1);

            const makePlayer = p => {
                const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1e2738"/><text x="50" y="50" font-family="sans-serif" font-size="34" fill="#ff9f43" font-weight="bold" text-anchor="middle" dominant-baseline="central">${p.name.substring(0,2).toUpperCase()}</text></svg>`;
                const url = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgStr)}`;
                return `<div class="fpl-player"><div class="fpl-avatar"><img src="${url}"></div><div class="fpl-name">${p.name}</div><div class="fpl-pts">${(p.xPts||0).toFixed(1)}</div></div>`;
            };
            const gk = sq.starters.filter(x=>x.position===1).map(makePlayer).join('');
            const def = sq.starters.filter(x=>x.position===2).map(makePlayer).join('');
            const mid = sq.starters.filter(x=>x.position===3).map(makePlayer).join('');
            const fwd = sq.starters.filter(x=>x.position===4).map(makePlayer).join('');
            document.getElementById('fplPitch').innerHTML = `<div class="fpl-row">${fwd}</div><div class="fpl-row">${mid}</div><div class="fpl-row">${def}</div><div class="fpl-row">${gk}</div>`;
            document.getElementById('fplLoading').style.display = 'none'; document.getElementById('fplContent').style.display = 'block';
        } catch(e) { document.getElementById('fplLoading').style.display = 'none'; }
    }

    function openHistory() { document.getElementById('histMask').classList.add('show'); renderHistoryList(); }
    function closeHistory() { document.getElementById('histMask').classList.remove('show'); }

    function renderHistoryList() {
        const hist = JSON.parse(localStorage.getItem('pl_history')||'[]');
        if(hist.length===0) { document.getElementById('histList').innerHTML = '<div class="empty">暂无记录</div>'; return; }
        document.getElementById('histList').innerHTML = hist.map(x=>`
            <div style="background:var(--surface-2);padding:12px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;">
                <div>
                    <div style="font-weight:600;">${x.h} vs ${x.a}</div>
                    <div style="font-size:11px;color:var(--text-3);">预测: ${x.score} · 概率: ${x.hw}/${x.dr}/${x.aw}</div>
                </div>
            </div>
        `).join('');
    }

    // 初始化
    if(localStorage.getItem('groq_key')) document.getElementById('apiKey').value = localStorage.getItem('groq_key');
    loadData();
    loadFPL();
</script>
</body>
</html>
